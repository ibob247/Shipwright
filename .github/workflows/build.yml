name: Build Shipwright VR Mod (Windows)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: |
          choco install cmake ninja visualstudio2022buildtools --yes --ignore-checksums

      - name: Configure CMake (MSVC + Ninja)
        run: |
          cmake -B build-cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -T host=x64

      - name: Build project
        run: |
          cmake --build build-cmake --target GenerateSohOtr --config Release --parallel

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-vr-windows
          path: build-cmake/soh/soh.exe
