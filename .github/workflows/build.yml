name: Build Shipwright VR Mod

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libglfw3-dev libglew-dev libsdl2-dev ninja-build pkg-config
          # Install OpenXR SDK
          sudo apt-get install -y libopenxr-dev

      - name: Configure CMake
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --build build-cmake --config Release --target GenerateSohOtr -j3

      - name: Archive Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-vr-build
          path: build-cmake/soh/soh
