name: Build Shipwright VR Mod (Windows)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          choco install cmake visualstudio2022buildtools --yes --ignore-checksums

      - name: Configure CMake with Visual Studio
        run: |
          cmake -B build-cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build-cmake --target GenerateSohOtr --config Release

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-vr-windows
          path: build-cmake/soh/Release/soh.exe
