name: Build Shipwright VR Mod (Windows)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: |
          choco install cmake visualstudio2022buildtools --yes --ignore-checksums

      - name: Install OpenXR SDK
        run: |
          curl -LO https://registry.khronos.org/OpenXR/sdk/latest/windows/OpenXR-SDK-Installer.exe
          Start-Process -Wait -FilePath .\OpenXR-SDK-Installer.exe -ArgumentList '/install', '/quiet', '/norestart'

      - name: Set OpenXR path
        run: |
          echo "OPENXR_DIR=C:\\Program Files\\Khronos\\OpenXR SDK" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build-cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=\"C:/Program Files/Khronos/OpenXR SDK\" 

      - name: Build project
        run: |
          cmake --build build-cmake --target GenerateSohOtr --config Release

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-vr-windows
          path: build-cmake/soh/Release/soh.exe
