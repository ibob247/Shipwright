name: Build Shipwright VR Mod (Windows)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          choco install cmake ninja visualstudio2022buildtools --yes --ignore-checksums
          refreshenv

      - name: Configure CMake
        run: >
          cmake -B build-cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: >
          cmake --build build-cmake --target GenerateSohOtr --config Release --parallel

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-vr-windows-build
          path: build-cmake/soh/soh.exe
